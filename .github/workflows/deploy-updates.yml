name: Deploy Qubyx Updates

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package WordPress theme and plugin
        shell: pwsh
        run: ./tools/package-release.ps1

      - name: Deploy Cloudflare Worker
        working-directory: update-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c75d1c874847bf74e930e26b30615d9d
        run: |
          npm install
          npm run deploy
